; Digi-Santé Junior — Development PHP Configuration

; Use the application's local timezone.
date.timezone = Europe/Paris

; Allow sufficient memory for Symfony and development tools.
memory_limit = 512M

; Display all PHP errors during development.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Revalidate cached PHP files on every request during development.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
